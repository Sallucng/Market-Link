    # Markets
    Market:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Greenfield Central Farmers Market
        location:
          type: string
          example: Greenfield
        address:
          type: string
          example: 100 Market Square, Greenfield, CA 95001
        latitude:
          type: number
          format: float
          example: 37.7749000
        longitude:
          type: number
          format: float
          example: -122.4194000
        operating_days:
          type: array
          items:
            type: string
          example: [Saturday, Sunday]
        open_time:
          type: string
          example: '08:00'
        close_time:
          type: string
          example: '14:00'
        status:
          type: string
          enum: [active, inactive]
          example: active

    MarketRequest:
      type: object
      required:
        - name
        - location
        - address
        - operating_days
        - open_time
        - close_time
      properties:
        name:
          type: string
          example: Greenfield Central Farmers Market
        location:
          type: string
          example: Greenfield
        address:
          type: string
          example: 100 Market Square, Greenfield, CA 95001
        latitude:
          type: number
          format: float
          example: 37.7749000
        longitude:
          type: number
          format: float
          example: -122.4194000
        operating_days:
          type: array
          items:
            type: string
          example: [Saturday, Sunday]
        open_time:
          type: string
          example: '08:00'
        close_time:
          type: string
          example: '14:00'
        status:
          type: string
          enum: [active, inactive]
          example: active

