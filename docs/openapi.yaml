# -----------------------------------------------------------------------------
# Components & Reusable Schemas
# -----------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
      description: Enter the Sanctum Bearer token received from registration or authentication.

  responses:
    401Unauthorized:
      description: Unauthenticated. Token missing, expired, or invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.

    403FarmerForbidden:
      description: Forbidden. Authenticated user does not possess an active farmer role or is unverified.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Unauthorized. Farmer access required.

    403AdminForbidden:
      description: Forbidden. Administrator privileges required.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Unauthorized. Administrator access required.

    404NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Resource not found.

    422ValidationError:
      description: Request body validation failed.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Validation errors occurred.
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  business_name:
                    - The business_name field is required.
                  operating_days:
                    - Please select at least one operating day for your farm.

  schemas:
    # Users & Auth
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Peterson
        email:
          type: string
          format: email
          example: farmer.john@marketlink.com
        role:
          type: string
          enum: [admin, farmer, customer]
          example: farmer
        status:
          type: string
          enum: [pending, active, suspended]
          example: active
        created_at:
          type: string
          format: date-time
          example: '2026-09-24T08:00:00.000000Z'

    # Farmer Profile
    FarmerProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        business_name:
          type: string
          example: Sunrise Organic Acres
        description:
          type: string
          example: Certified organic family farm specializing in seasonal heirloom produce.
        stall_number:
          type: string
          example: Stall #14
        address:
          type: string
          example: 450 Valley Road, Greenfield, CA 95001
        latitude:
          type: number
          format: float
          example: 37.7600000
        longitude:
          type: number
          format: float
          example: -122.4200000
        operating_days:
          type: array
          items:
            type: string
          example: [Wednesday, Saturday, Sunday]
        pickup_start_time:
          type: string
          example: '08:00'
        pickup_end_time:
          type: string
          example: '13:00'
        is_approved:
          type: boolean
          example: true
        rejection_reason:
          type: string
          nullable: true
          example: null
        user:
          $ref: '#/components/schemas/User'
        markets:
          type: array
          items:
            $ref: '#/components/schemas/Market'

    FarmerRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
        - business_name
        - address
        - operating_days
      properties:
        name:
          type: string
          example: John Peterson
        email:
          type: string
          format: email
          example: farmer.john@marketlink.com
        password:
          type: string
          format: password
          minLength: 8
          example: Farmer123!
        password_confirmation:
          type: string
          format: password
          example: Farmer123!
        business_name:
          type: string
          example: Sunrise Organic Acres
        description:
          type: string
          example: Family-owned certified organic farm harvesting seasonal vegetables.
        stall_number:
          type: string
          example: Stall #14
        address:
          type: string
          example: 450 Valley Road, Greenfield, CA 95001
        latitude:
          type: number
          format: float
          example: 37.7600000
        longitude:
          type: number
          format: float
          example: -122.4200000
        operating_days:
          type: array
          items:
            type: string
            enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
          example: [Wednesday, Saturday, Sunday]
        pickup_start_time:
          type: string
          example: '08:00'
        pickup_end_time:
          type: string
          example: '13:00'

    FarmerRegisterResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Farmer registration submitted successfully. Your account is pending admin verification.
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
              example: 1|9a8b7c6d5e4f3a2b1c0d...

    FarmerProfileUpdateRequest:
      type: object
      properties:
        business_name:
          type: string
          example: Sunrise Organic Acres & Orchards
        description:
          type: string
          example: Expanded organic farm harvesting heirloom tomatoes, peaches, and berries.
        stall_number:
          type: string
          example: Stall #15
        address:
          type: string
          example: 455 Valley Road, Greenfield, CA 95001
        latitude:
          type: number
          example: 37.7605000
        longitude:
          type: number
          example: -122.4205000
        operating_days:
          type: array
          items:
            type: string
            enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
          example: [Thursday, Saturday, Sunday]
        pickup_start_time:
          type: string
          example: '08:30'
        pickup_end_time:
          type: string
          example: '13:30'
        market_ids:
          type: array
          items:
            type: integer
          example: [1, 2]

    FarmerProfileResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/FarmerProfile'

    # Products
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        farmer_profile_id:
          type: integer
          example: 1
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: Organic Heirloom Tomatoes
        slug:
          type: string
          example: organic-heirloom-tomatoes-66f27b
        description:
          type: string
          example: Vine-ripened multicolor heirloom tomatoes with rich sweet acidity.
        price:
          type: string
          example: '4.99'
        unit:
          type: string
          example: kg
        stock_quantity:
          type: integer
          example: 60
        weekly_quota:
          type: integer
          example: 80
        image_path:
          type: string
          example: products/heirloom_tomatoes.jpg
        is_available:
          type: boolean
          example: true
        is_moderated:
          type: boolean
          example: false
        category:
          $ref: '#/components/schemas/Category'

    ProductStoreRequest:
      type: object
      required:
        - name
        - category_id
        - price
        - unit
        - stock_quantity
      properties:
        name:
          type: string
          example: Organic Heirloom Tomatoes
        category_id:
          type: integer
          example: 1
        description:
          type: string
          example: Vine-ripened multicolor heirloom tomatoes with rich sweet acidity.
        price:
          type: number
          format: float
          minimum: 0
          example: 4.99
        unit:
          type: string
          example: kg
        stock_quantity:
          type: integer
          minimum: 0
          example: 60
        weekly_quota:
          type: integer
          minimum: 0
          example: 80
        image:
          type: string
          format: binary
          description: Max 2048KB image file (jpeg, png, jpg, webp).
        is_available:
          type: boolean
          example: true

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Organic Heirloom Tomatoes (Jumbo Box)
        category_id:
          type: integer
          example: 1
        description:
          type: string
          example: Vine-ripened multicolor heirloom tomatoes packed in wooden display boxes.
        price:
          type: number
          format: float
          minimum: 0
          example: 5.50
        unit:
          type: string
          example: box
        stock_quantity:
          type: integer
          minimum: 0
          example: 45
        weekly_quota:
          type: integer
          minimum: 0
          example: 70
        image:
          type: string
          format: binary
          description: Optional replacement image file.
        is_available:
          type: boolean
          example: true

    ProductSingleResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Product created successfully.
        data:
          $ref: '#/components/schemas/Product'

    ProductListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            data:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            per_page:
              type: integer
              example: 15
            total:
              type: integer
              example: 25

    # Orders
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        order_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        unit_price:
          type: string
          example: '4.99'
        subtotal:
          type: string
          example: '9.98'
        product:
          $ref: '#/components/schemas/Product'

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        order_number:
          type: string
          example: ORD-0001
        customer_id:
          type: integer
          example: 9
        farmer_profile_id:
          type: integer
          example: 1
        market_id:
          type: integer
          example: 1
        total_amount:
          type: string
          example: '25.50'
        status:
          type: string
          enum: [pending, accepted, declined, ready_for_pickup, completed, cancelled]
          example: pending
        pickup_slot:
          type: string
          example: 09:00 AM - 10:00 AM
        decline_reason:
          type: string
          nullable: true
          example: null
        cutoff_time:
          type: string
          format: date-time
          example: '2026-09-24T18:00:00.000000Z'
        created_at:
          type: string
          format: date-time
          example: '2026-09-24T07:00:00.000000Z'
        customer:
          $ref: '#/components/schemas/User'
        market:
          $ref: '#/components/schemas/Market'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [accepted, declined, ready_for_pickup]
          example: accepted
        decline_reason:
          type: string
          maxLength: 500
          description: Mandatory when status is set to declined.
          example: Insufficient inventory due to overnight frost damage.

    OrderSingleResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Order status transitioned to accepted successfully.
        data:
          $ref: '#/components/schemas/Order'

    OrderListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            data:
              type: array
              items:
                $ref: '#/components/schemas/Order'
            per_page:
              type: integer
              example: 15
            total:
              type: integer
              example: 10

    FarmerDashboardStatsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
