openapi: 3.0.3
info:
  title: MarketLink API - Farmer & Admin Modules
  description: >
    Comprehensive OpenAPI 3.0 specification for MarketLink, an agricultural direct-to-consumer
    platform connecting consumers directly with verified local farmers for fresh harvest pre-orders
    and physical market pickup. This document fully details the Farmer Module, Inventory, Order
    Processing, Content Moderation, and Administrator Management boundaries.
  version: 1.0.0
  contact:
    name: MarketLink Engineering Team
    email: api-support@marketlink.com
  license:
    name: Proprietary

servers:
  - url: https://api.marketlink.com
    description: Production API Server
  - url: http://localhost:8000
    description: Local Development Server

tags:
  - name: Farmer Authentication & Profile
    description: Farmer registration, account authentication, and farm profile management.
  - name: Farmer Products & Inventory
    description: Agricultural produce catalog, stock quantities, and availability toggles.
  - name: Farmer Orders
    description: Farmer order lifecycle processing (accept, decline, ready for pickup, complete).
  - name: Farmer Reviews
    description: Viewing verified customer reviews and publishing farmer replies.
  - name: Admin Dashboard
    description: Platform-wide analytics, key performance indicators, and transaction summaries.
  - name: Admin Farmer Management
    description: Reviewing farmer onboarding applications, approvals, and account suspensions.
  - name: Admin Customer Management
    description: Inspecting customer accounts and toggling active/suspended access status.
  - name: Admin Markets
    description: CRUD management of physical farmer markets, operating days, and GPS coordinates.
  - name: Admin Categories
    description: Standard system-wide product categories management.
  - name: Admin Content Moderation
    description: Moderating agricultural products and public customer reviews.
  - name: Admin Announcements
    description: System-wide broadcast announcements targeting farmers, customers, or all users.

paths:
  # ---------------------------------------------------------------------------
  # 1. Farmer Authentication & Profile
  # ---------------------------------------------------------------------------
  /api/v1/farmer/register:
    post:
      tags:
        - Farmer Authentication & Profile
      summary: Register a new farmer account and business profile
      description: >
        Creates a new user with the `farmer` role and `pending` status, stores farm business
        profile information with operating days and pickup schedules, and returns an initial
        Sanctum authentication token.
      operationId: registerFarmer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerRegisterRequest'
      responses:
        '201':
          description: Farmer account registered successfully and awaiting admin verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerRegisterResponse'
        '422':
          $ref: '#/components/responses/422ValidationError'

  /api/v1/farmer/profile:
    get:
      tags:
        - Farmer Authentication & Profile
      summary: Retrieve authenticated farmer profile
      description: Returns the authenticated farmer's business profile, operating days, pickup windows, and associated physical markets.
      operationId: getFarmerProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Farmer profile details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerProfileResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'

    put:
      tags:
        - Farmer Authentication & Profile
      summary: Update farmer profile & market associations
      description: Updates the business name, description, stall number, physical address, GPS coordinates, operating schedule, and market associations.
      operationId: updateFarmerProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerProfileUpdateRequest'
      responses:
        '200':
          description: Farmer profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerProfileResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'

  # ---------------------------------------------------------------------------
  # 2. Farmer Products & Inventory
  # ---------------------------------------------------------------------------
  /api/v1/farmer/products:
    get:
      tags:
        - Farmer Products & Inventory
      summary: List all products belonging to the authenticated farmer
      description: Retrieves a paginated list of catalog items with category details and optional search or category filtering.
      operationId: listFarmerProducts
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          description: Filter products by category ID.
          required: false
          schema:
            type: integer
            example: 1
        - name: search
          in: query
          description: Filter products by matching name or description substring.
          required: false
          schema:
            type: string
            example: heirloom
        - name: is_available
          in: query
          description: Filter by availability status.
          required: false
          schema:
            type: boolean
            example: true
        - name: page
          in: query
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Items per page.
          required: false
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Paginated product list retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'

    post:
      tags:
        - Farmer Products & Inventory
      summary: Create a new agricultural product
      description: >
        Uploads product image (max 2MB), verifies weekly stock quota, and persists the product
        under the authenticated farmer's profile.
      operationId: storeFarmerProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductStoreRequest'
      responses:
        '201':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSingleResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'

  /api/v1/farmer/products/{id}:
    get:
      tags:
        - Farmer Products & Inventory
      summary: Get details of a specific farmer product
      description: Fetches full product details including category and farmer association.
      operationId: getFarmerProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique product identifier.
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Product details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSingleResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

    put:
      tags:
        - Farmer Products & Inventory
      summary: Update product specifications and inventory
      description: Updates product metadata, price, units, stock quantities, and optional new image file.
      operationId: updateFarmerProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID to update.
          schema:
            type: integer
            example: 10
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSingleResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422ValidationError'

    delete:
      tags:
        - Farmer Products & Inventory
      summary: Delete or unpublish product
      description: Deletes product and removes stored image file from storage disk.
      operationId: deleteFarmerProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID to delete.
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Product removed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Product removed successfully.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /api/v1/farmer/products/{id}/toggle-availability:
    patch:
      tags:
        - Farmer Products & Inventory
      summary: Toggle product availability state
      description: Instantly switches product status between available and sold-out / unavailable.
      operationId: toggleFarmerProductAvailability
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID.
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Availability state toggled successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Product availability status changed to unavailable.
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ---------------------------------------------------------------------------
  # 3. Farmer Order Management
  # ---------------------------------------------------------------------------
  /api/v1/farmer/orders:
    get:
      tags:
        - Farmer Orders
      summary: List incoming customer orders
      description: Returns incoming orders filtered by lifecycle status with customer and line item details.
      operationId: listFarmerOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter orders by lifecycle status.
          required: false
          schema:
            type: string
            enum: [pending, accepted, declined, ready_for_pickup, completed, cancelled]
            example: pending
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Incoming orders retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'

  /api/v1/farmer/orders/{id}:
    get:
      tags:
        - Farmer Orders
      summary: Retrieve order details
      description: Returns full breakdown for an individual order including customer details, market stall pickup slot, and line items.
      operationId: getFarmerOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID.
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Order details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSingleResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /api/v1/farmer/orders/{id}/status:
    patch:
      tags:
        - Farmer Orders
      summary: Update order status along lifecycle
      description: >
        Transitions order status to `accepted`, `declined`, or `ready_for_pickup`.
        Restocks inventory if declined before cutoff time.
      operationId: updateFarmerOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID.
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: Order status updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSingleResponse'
        '400':
          description: Cutoff time passed or invalid status transition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Cannot modify order after cutoff time has passed.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422ValidationError'

  /api/v1/farmer/dashboard/stats:
    get:
      tags:
        - Farmer Orders
      summary: Get operational metrics and dashboard statistics
      description: Returns aggregate counts of total, pending, and completed orders, platform revenue, active products, and customer rating averages.
      operationId: getFarmerDashboardStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Farmer dashboard metrics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerDashboardStatsResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'

  # ---------------------------------------------------------------------------
  # 4. Farmer Reviews
  # ---------------------------------------------------------------------------
  /api/v1/farmer/reviews:
    get:
      tags:
        - Farmer Reviews
      summary: List customer reviews for authenticated farmer
      description: Lists reviews and ratings with customer details, order item references, and existing replies.
      operationId: listFarmerReviews
      security:
        - bearerAuth: []
      parameters:
        - name: rating
          in: query
          description: Filter by exact star rating (1-5).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
            example: 5
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Customer reviews retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'

  /api/v1/farmer/reviews/{id}/reply:
    post:
      tags:
        - Farmer Reviews
      summary: Reply to a customer review
      description: Publishes or updates the farmer's response to an existing customer review.
      operationId: replyFarmerReview
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Review ID.
          schema:
            type: integer
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerReviewReplyRequest'
      responses:
        '200':
          description: Reply published successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSingleResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403FarmerForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422ValidationError'

  # ---------------------------------------------------------------------------
  # 5. Admin Module
  # ---------------------------------------------------------------------------
  /api/v1/admin/dashboard/stats:
    get:
      tags:
        - Admin Dashboard
      summary: Aggregate platform-wide summary metrics
      description: Computes aggregate statistics across total farmers, active customers, physical markets, platform orders, and total gross revenue.
      operationId: getAdminDashboardStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform statistics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardStatsResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'

  /api/v1/admin/farmers:
    get:
      tags:
        - Admin Farmer Management
      summary: List registered farmer profiles
      description: Lists farmer accounts with filter by approval/suspension status, name, and email.
      operationId: listAdminFarmers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by account status.
          required: false
          schema:
            type: string
            enum: [pending, active, suspended]
            example: pending
        - name: search
          in: query
          description: Search by farmer name, business name, or email.
          required: false
          schema:
            type: string
            example: Organic
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Farmer accounts retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFarmerListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'

  /api/v1/admin/farmers/{id}/approve:
    patch:
      tags:
        - Admin Farmer Management
      summary: Approve farmer account application
      description: Sets farmer user status to `active`, marks farmer profile `is_approved` to true, and activates their stalls.
      operationId: approveAdminFarmer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID of the farmer to approve.
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Farmer account approved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Farmer account approved and activated successfully.
                  data:
                    $ref: '#/components/schemas/FarmerProfile'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /api/v1/admin/farmers/{id}/suspend:
    patch:
      tags:
        - Admin Farmer Management
      summary: Suspend farmer account
      description: >
        Suspends the farmer account, revokes active access tokens, marks all their products
        unavailable, and stores an administrative suspension reason.
      operationId: suspendAdminFarmer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID of the farmer to suspend.
          schema:
            type: integer
            example: 5
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Repeated failure to fulfill customer pre-orders during market hours.
      responses:
        '200':
          description: Farmer account suspended successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Farmer account suspended and products made unavailable.
                  data:
                    $ref: '#/components/schemas/FarmerProfile'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /api/v1/admin/customers:
    get:
      tags:
        - Admin Customer Management
      summary: List registered customer accounts
      description: Paginated view of customer accounts with order counts and search filters.
      operationId: listAdminCustomers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, pending, suspended]
        - name: search
          in: query
          schema:
            type: string
            example: Alice
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Customers retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'

  /api/v1/admin/customers/{id}/toggle-status:
    patch:
      tags:
        - Admin Customer Management
      summary: Activate, deactivate, or suspend customer account
      description: Modifies customer account status and revokes active tokens upon suspension.
      operationId: toggleAdminCustomerStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Customer User ID.
          schema:
            type: integer
            example: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, suspended]
                  example: suspended
      responses:
        '200':
          description: Customer account status updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Customer status updated to suspended.
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422ValidationError'

  /api/v1/admin/markets:
    get:
      tags:
        - Admin Markets
      summary: List all farmers markets
      description: Retrieves all physical farmers markets registered in the system.
      operationId: listAdminMarkets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Markets retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Market'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'

    post:
      tags:
        - Admin Markets
      summary: Create a physical farmers market
      description: Registers a new market location with GPS coordinates and operating schedules.
      operationId: storeAdminMarket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketRequest'
      responses:
        '201':
          description: Market created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Market created successfully.
                  data:
                    $ref: '#/components/schemas/Market'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'

  /api/v1/admin/markets/{id}:
    get:
      tags:
        - Admin Markets
      summary: Get market details
      description: Returns full details of a specific farmers market including approved vendor stalls.
      operationId: getAdminMarket
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Market details retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Market'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

    put:
      tags:
        - Admin Markets
      summary: Update farmers market location and schedule
      description: Updates market name, location, coordinates, and operating hours.
      operationId: updateAdminMarket
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketRequest'
      responses:
        '200':
          description: Market updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Market updated successfully.
                  data:
                    $ref: '#/components/schemas/Market'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403AdminForbidden'
        '404':
